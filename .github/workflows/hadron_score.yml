# Hadron: test a model's answers to the training tasks (hadron_score.py --set train), one job per part, all at once,
# then a final job that writes the pass rates and the two task lists (rates/ in the hadron-data dataset):
#   rl_tasks_<tag>.jsonl         tasks the model solves 1-3 times out of 4 (the RL set)
#   distill_targets_<tag>.jsonl  tasks it never solves
# Make the answers on molab first (molab_hadron_bench.py, "Training tasks"), then: Actions tab >
# "Hadron task scoring" > Run workflow. Parts already scored are skipped. Needs the repository secret HF_TOKEN
# (write access to the hadron-data dataset). The logs show pass counts, not the answers or the token.
name: Hadron task scoring

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Model tag under gen/ in hadron-data (as molab_hadron_bench.py names it)"
        required: true
        default: "Mellum2.1-12B-A2.5B-Thinking-32k"

permissions:
  contents: read

concurrency:
  group: hadron-score-${{ inputs.tag }}
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TAG: ${{ inputs.tag }}
  PYTHONIOENCODING: utf-8

jobs:
  score:
    name: part-${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a part takes ~2 min; a hang should fail fast
    strategy:
      fail-fast: false
      matrix:
        # 2,871 training tasks in parts of 250 (molab_hadron_bench.py PART) = 12 parts; a missing part is a no-op
        part: ["000", "001", "002", "003", "004", "005", "006", "007", "008", "009", "010", "011"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4  # the JS/TS tests need Node 22.7+ (type stripping); ubuntu-24.04 has g++ 13 for C++23
        with:
          node-version: "24"
      - run: pip install -q huggingface_hub
      - name: Test the answers in part-${{ matrix.part }}
        run: python -u hadron_score.py "$TAG" --set train --part "part-${{ matrix.part }}" --workers 4

  final:
    needs: score
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -q huggingface_hub
      - name: Pass rates and task lists (tests any part a job missed)
        run: python -u hadron_score.py "$TAG" --set train --workers 4
